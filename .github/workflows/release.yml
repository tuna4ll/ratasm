name: Release

# Pushing a version tag builds the binaries, publishes a GitHub release and
# pushes the crate. Everything is driven by the tag, so cutting a release is
# one `git push --tags`.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse to release something that does not build and test cleanly, and
  # refuse to release a tag that disagrees with Cargo.toml.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install the assembly toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils gdb

      - name: Resolve the version
        id: version
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag_version="${tag#v}"
          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')

          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag $tag says $tag_version but Cargo.toml says $crate_version"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-features

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl first: it is what the install script downloads, because it
          # runs regardless of the host's glibc version.
          - target: x86_64-unknown-linux-musl
            packages: musl-tools
          - target: x86_64-unknown-linux-gnu
            packages: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Confirm the binary starts
        run: ./target/${{ matrix.target }}/release/ratasm --version

      - name: Package
        run: |
          set -eu
          name="ratasm-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/ratasm" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/" 2>/dev/null || true

          # The archive holds the binary at its root so the install script can
          # find it without knowing the directory name.
          tar -czf "dist/$name.tar.gz" -C "dist/$name" .
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ratasm-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect the release assets
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec cp {} release/ \;
          # The installer is fetched from the release itself, so it ships too.
          cp install.sh release/
          ls -l release

      - name: Extract the changelog entry
        id: notes
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            # Everything between this version's heading and the next one.
            awk -v v="$version" '
              $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
              found && /^## / { exit }
              # Link reference definitions belong to the file, not the notes.
              found && /^\[[^]]+\]: / { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            printf 'Release %s.\n' "$version" > release-notes.md
          fi
          cat release-notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ratasm ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true

  publish:
    name: Publish to crates.io
    needs: [verify, release]
    runs-on: ubuntu-latest
    # Skipped when no token is configured, so a fork can still cut its own
    # GitHub releases without holding the crate's credentials.
    if: ${{ !github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the package contents
        run: cargo package --locked --list

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping crates.io"
            exit 0
          fi

          # A version on crates.io can never be replaced, so re-running a
          # release must report that and stop rather than fail the workflow.
          if curl -sSfL -o /dev/null -H 'User-Agent: ratasm-release' \
               "https://crates.io/api/v1/crates/ratasm/$version" 2>/dev/null; then
            echo "::notice::ratasm $version is already on crates.io; nothing to publish"
            exit 0
          fi

          cargo publish --locked
